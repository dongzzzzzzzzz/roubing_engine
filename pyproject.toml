[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roubing-engine"
version = "0.2.0"
description = "Look-ahead-clean roubing-style A-share daily reasoning engine"
requires-python = ">=3.11"
dependencies = [
  "eltdx>=3.1.7",
  "pyarrow>=25.0",
  "pandas>=2.2",
]

[project.scripts]
roubing-capture = "run_capture:main"
roubing-capture-codes = "capture_codes:main"
roubing-capture-context = "capture_context:main"
roubing-eod = "roubing_engine.reasoning.eod_pipeline:main"
roubing-validate = "roubing_engine.reasoning.validate_pipeline:main"
roubing-walk-forward = "roubing_engine.reasoning.walk_forward:main"

[tool.setuptools]
py-modules = ["run_capture", "capture_codes", "capture_context"]

[tool.setuptools.packages.find]
where = ["."]
include = ["roubing_engine*"]

[tool.setuptools.package-data]
"roubing_engine.rules" = ["*.json"]
